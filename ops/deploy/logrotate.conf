# /etc/logrotate.d/leadengine: logs are kept 90 days, compressed. Outreach records themselves live in
# the database (activities, audit_log), so rotating these logs loses nothing that must be kept.
/var/log/leadengine/*.log {
    weekly
    rotate 13
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su leadengine leadengine
}
