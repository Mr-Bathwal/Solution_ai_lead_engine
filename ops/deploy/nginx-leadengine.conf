# An example for the platform's proxy, if it is nginx (any HTTPS proxy works the same way). Two hosts:
# the founders' company pages, open to the internet, and the Admin pages, for the team only.
# Certificates: certbot --nginx -d pages.<outreach domain> -d leads-admin.solutionai.in

server {
    listen 443 ssl http2;
    server_name pages.example-outreach.in;            # PUBLIC_BASE_URL=https://pages.example-outreach.in
    # ssl_certificate / ssl_certificate_key: from certbot

    client_max_body_size 1m;                         # the claim form, and Meta's and Sarvam's webhooks
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # with PUBLIC_TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    server_name leads-admin.solutionai.in;
    # ssl_certificate / ssl_certificate_key: from certbot

    # The Admin pages carry personal data: keep them to the office and VPN addresses. /api/events and
    # /mcp are called by the platform's own servers, so their addresses are allowed too.
    allow 203.0.113.0/24;                            # the office (replace)
    allow 198.51.100.10;                             # the platform's servers (replace)
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # with ADMIN_TRUST_PROXY=1
        proxy_set_header X-Forwarded-Proto https;
    }

    # the monthly MCA workbook (a few MB; the engine refuses anything over 30 MB)
    location ~ ^/(admin|api)/mca$ {
        client_max_body_size 32m;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name pages.example-outreach.in leads-admin.solutionai.in;
    return 301 https://$host$request_uri;
}
